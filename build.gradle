plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'com.github.davidmc24.gradle.plugin.avro' version '1.9.1'
}


allprojects {
    apply plugin: 'maven-publish'
}



group = 'com.example'
version = '0.0.1-SNAPSHOT'

// Configure the fat JAR (default behavior of Spring Boot)
bootJar {
    archiveFileName = "${project.group}-${project.name}-${project.version}.jar"
}

// Ensure the plain JAR is not created
tasks.named('jar') {
    enabled = false
}


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    
    // Configure Avro source set
    sourceSets {
        main {
            java {
                srcDirs 'src/main/java', 'build/generated-main-avro-java'
            }
        }
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    // Add this for Confluent artifacts
    maven {
        url 'https://packages.confluent.io/maven'
    }
}

ext {
    set('springCloudVersion', "2023.0.2")
}

dependencies {
    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.apache.kafka:kafka-streams'
    implementation 'org.springframework.cloud:spring-cloud-stream'
    implementation 'org.springframework.cloud:spring-cloud-stream-binder-kafka'
    implementation 'org.springframework.cloud:spring-cloud-stream-binder-kafka-streams'
    implementation 'org.springframework.kafka:spring-kafka'
    
    // Avro dependencies
    implementation 'org.apache.avro:avro:1.12.1'
    implementation 'io.confluent:kafka-avro-serializer:8.0.0'
    implementation 'io.confluent:kafka-schema-registry-client:8.0.0'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.cloud:spring-cloud-stream-test-binder'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // faker
    implementation 'net.datafaker:datafaker:1.5.0'

    testImplementation 'org.mockito:mockito-core:5.12.0'

    // test artifactory
//    implementation 'com.example:springkafka:0.0.1-SNAPSHOT'

}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}


publishing {
    publications {
        myMaven(MavenPublication) {
            from components.java
            groupId = group
            artifactId = jar.archiveBaseName
            version = "${version}"

            pom {
                name = 'My Kafka Library'
                description = 'A description of my kafka library'

            }
        }
    }
    repositories {
//        maven {
//            credentials {
//                username = "${ARTIFACTORY_USER}"
//                password = "${ARTIFACTORY_PASSWORD}"
//            }
//            url = 'http://192.168.122.157:8081/artifactory/jfrog-gradle-dev-local'
//            allowInsecureProtocol = true
//        }
    }
}


name: spring-kafka
namespace: spring-kafka
replicaCount: 1

deployment:
  name: spring-kafka-deployment

image:
  registry: docker.io
# repo should be passed during CI
  repository: spring-kafka
  owner: arun912
# tag should be passed during CI
  tag: latest
  pullPolicy: IfNotPresent

service:
  name: spring-kafka-service
  type: ClusterIP
  port: 80

ingress:
  name: spring-kafka-ingress
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  host: "kafka.kube.lan"
  hosts:
      paths:
        - /
  tls: []



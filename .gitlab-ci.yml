helm_lint_template:
  stage: helm_kube_deploy
  needs: [docker_image_build_push, docker_image_tag, set_env_variables]
  image: alpine/k8s:1.32.5

  script:
    - helm lint ./helm
    - helm template ./helm --set image.tag=$IMAGE_TAG

helm_kube_deploy:
  stage: helm_kube_deploy
  needs: [docker_image_build_push, helm_lint_template, docker_image_tag, set_env_variables]
  image: alpine/k8s:1.32.5
  before_script:
    - |
      #! /bin/bash
      mkdir -p ~/.kube && touch ~/.kube/config
      echo "${KUBE_CONFIG}" | base64 -d > ~/.kube/config
      chmod 600 ~/.kube/config
      kubectl get all --all-namespaces
  script: |
    echo "helm upgrade --install $APP_NAME-$CI_COMMIT_REF_NAME --namespace $APP_NAME --create-namespace ./helm --set image.tag=$IMAGE_TAG --wait --timeout 300s --atomic" 
    helm upgrade --install "${APP_NAME}-${CI_COMMIT_REF_NAME}" --namespace $APP_NAME --create-namespace ./helm --set image.tag=$IMAGE_TAG  --wait --timeout 300s --atomic 
    echo "# Optional: Confirm rollout is healthy (extra guard) : kubectl rollout status deployment -n $APP_NAME --timeout=300s"
    kubectl rollout status deployment -n $APP_NAME --timeout=300s 

helm_kube_uninstall:
  stage: helm_kube_deploy
  needs: [docker_image_build_push, set_env_variables]
  image: alpine/k8s:1.32.5
  before_script:
    - |
      #! /bin/bash
      mkdir -p ~/.kube && touch ~/.kube/config
      echo "${KUBE_CONFIG}" | base64 -d > ~/.kube/config
      chmod 600 ~/.kube/config
      kubectl get all -A
  script: |
    echo "helm uninstall $APP_NAME-$CI_COMMIT_REF_NAME --namespace $APP_NAME" 
    helm uninstall "${APP_NAME}-${CI_COMMIT_REF_NAME}" --namespace $APP_NAME
  when: manual
  allow_failure: true

